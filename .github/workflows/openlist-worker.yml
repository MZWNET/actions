name: Deploy OpenList Worker to Cloudflare Workers

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenList-Worker ref to deploy"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: openlist-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Repository secrets and variables are shared by every workflow here, and
      # cloud-mail.yml already claims the unprefixed NAME / CUSTOM_DOMAIN /
      # JWT_SECRET / KV_NAMESPACE_ID names, hence the OPENLIST_ prefix.
      NAME: ${{ secrets.OPENLIST_NAME || vars.OPENLIST_NAME || 'openlist-tsworkers' }}
      CUSTOM_DOMAIN: ${{ secrets.OPENLIST_CUSTOM_DOMAIN || vars.OPENLIST_CUSTOM_DOMAIN }}
      # Signs tokens and encrypts stored drive credentials and 2FA secrets;
      # upstream folded the former ENCRYPTION_SECRET into this one key.
      JWT_SECRET: ${{ secrets.OPENLIST_JWT_SECRET || vars.OPENLIST_JWT_SECRET }}
      DB_DRIVER: ${{ secrets.OPENLIST_DB_DRIVER || vars.OPENLIST_DB_DRIVER || 'auto' }}
      DB_FORMAT: ${{ secrets.OPENLIST_DB_FORMAT || vars.OPENLIST_DB_FORMAT }}
      KV_NAMESPACE_ID: ${{ secrets.OPENLIST_KV_NAMESPACE_ID || vars.OPENLIST_KV_NAMESPACE_ID }}
      D1_DATABASE_ID: ${{ secrets.OPENLIST_D1_DATABASE_ID || vars.OPENLIST_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check Cloudflare Credentials
        run: |
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::$var cannot be empty."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: OpenListTeam/OpenList-Worker
          ref: ${{ inputs.ref || 'main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      # Upstream's own CI and both one-click deploy buttons install without the
      # lockfile gate; the lockfile trails package.json often enough that
      # --frozen-lockfile would break the unattended weekly run.
      - name: Install Deps
        run: pnpm install --no-frozen-lockfile

      - name: Disable Wrangler Telemetry
        run: pnpm wrangler telemetry disable

      # The backend ships no frontend of its own: this clones OpenListTeam/
      # OpenList-Frontend, pulls the released translations and builds it into
      # ./dist, which wrangler serves through the ASSETS binding.
      - name: Build Frontend
        run: node scripts/fetch-frontend.mjs

      - name: Setup Wrangler Config
        run: |
          set -o pipefail
          CONFIG_FILE="wrangler-action.json"

          # blob is EdgeOne/ESA only, mysql needs a Node runtime, and do/cfkv
          # want bindings and credentials this workflow does not wire up.
          case "$DB_DRIVER" in
            auto | kv | d1) ;;
            *)
              echo "::error::DB_DRIVER must be one of: auto, kv, d1."
              exit 1
              ;;
          esac

          case "$DB_FORMAT" in
            "" | map | key | sql) ;;
            *)
              echo "::error::DB_FORMAT must be one of: map, key, sql."
              exit 1
              ;;
          esac

          if [ -n "$JWT_SECRET" ]; then
            if [ "${#JWT_SECRET}" -lt 16 ]; then
              echo "::error::JWT_SECRET must be at least 16 characters. Generate one with: openssl rand -hex 32"
              exit 1
            fi
          else
            # The Worker generates a signing key and an encryption key on first
            # use and persists both in KV, so this still works — but neither is
            # recoverable if the namespace is ever lost.
            echo "::warning::JWT_SECRET is not set; the Worker will generate and store its own keys."
          fi

          if [ -n "$CUSTOM_DOMAIN" ]; then
            if ! grep -qE '^[A-Za-z0-9.-]+$' <<< "$CUSTOM_DOMAIN"; then
              echo "::error::CUSTOM_DOMAIN must be a bare hostname (e.g. list.example.com)."
              exit 1
            fi
            # Masked here rather than relying on the secret being a secret: it is
            # also readable from vars, and wrangler echoes routes on deploy.
            echo "::add-mask::$CUSTOM_DOMAIN"
          else
            # Upstream ships workers_dev = false with no route, which would leave
            # the deployment unreachable.
            echo "::warning::CUSTOM_DOMAIN is not set, falling back to the workers.dev URL."
          fi

          # Upstream's wrangler.jsonc carries comments and trailing commas, so it
          # has to go through a JSONC reader before jq can take over.
          cat > jsonc.cjs <<'EOF'
          const src = require("fs").readFileSync("wrangler.jsonc", "utf8")
          let out = ""

          for (let i = 0; i < src.length; i++) {
            if (src[i] === '"') {
              let j = i + 1
              while (src[j] !== '"') j += src[j] === "\\" ? 2 : 1
              out += src.slice(i, j + 1)
              i = j
            } else if (src[i] === "/" && src[i + 1] === "/") {
              i = src.indexOf("\n", i)
              if (i < 0) break
            } else if (src[i] === "/" && src[i + 1] === "*") {
              i = src.indexOf("*/", i) + 1
            } else if (src[i] === "}" || src[i] === "]") {
              out = out.replace(/,\s*$/, "") + src[i]
            } else {
              out += src[i]
            }
          }

          process.stdout.write(JSON.stringify(JSON.parse(out)))
          EOF

          node jsonc.cjs | jq \
            --arg name "$NAME" \
            --arg domain "$CUSTOM_DOMAIN" \
            --arg driver "$DB_DRIVER" \
            --arg format "$DB_FORMAT" \
            --arg jwt "$JWT_SECRET" \
            '.name = $name
             | .vars.DB_DRIVER = $driver
             | if $format == "" then . else .vars.DB_FORMAT = $format end
             | if $jwt == "" then . else .vars.JWT_SECRET = $jwt end
             | if $domain == "" then .workers_dev = true
               else .routes = [{ pattern: $domain, custom_domain: true }] end' \
            > "$CONFIG_FILE"

      - name: Setup KV Namespace
        run: |
          CONFIG_FILE="wrangler-action.json"

          if [ -z "$KV_NAMESPACE_ID" ]; then
            KV_LIST=$(pnpm wrangler kv namespace list)

            if ! jq -e --arg t "$NAME" '.[] | select(.title == $t)' <<< "$KV_LIST" > /dev/null; then
              echo "KV namespace $NAME does not exist, creating it..."
              pnpm wrangler kv namespace create "$NAME"
              KV_LIST=$(pnpm wrangler kv namespace list)
            fi

            KV_NAMESPACE_ID=$(jq -r --arg t "$NAME" '.[] | select(.title == $t) | .id' <<< "$KV_LIST")
          fi

          # Upstream declares no storage binding at all, so its deploy button
          # cannot over-provision. KV is bound whatever DB_DRIVER says: the
          # generated keys, the token revocation list and the login-failure
          # counters only ever reach KV or Blob, never D1. Pinning the id keeps
          # every weekly run on the same namespace — a re-provisioned one would
          # come up empty.
          jq --arg id "$KV_NAMESPACE_ID" \
            '.kv_namespaces = [{ binding: "KV", id: $id }]' \
            "$CONFIG_FILE" > "$CONFIG_FILE.tmp" && mv "$CONFIG_FILE.tmp" "$CONFIG_FILE"

      - name: Setup D1 Database
        if: env.DB_DRIVER == 'd1'
        run: |
          CONFIG_FILE="wrangler-action.json"

          if [ -z "$D1_DATABASE_ID" ]; then
            DB_LIST=$(pnpm wrangler d1 list --json)

            if ! jq -e --arg n "$NAME" '.[] | select(.name == $n)' <<< "$DB_LIST" > /dev/null; then
              echo "D1 database $NAME does not exist, creating it..."
              pnpm wrangler d1 create "$NAME"
              DB_LIST=$(pnpm wrangler d1 list --json)
            fi

            D1_DATABASE_ID=$(jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' <<< "$DB_LIST")
          fi

          # No schema step is needed: the Worker runs its CREATE TABLE IF NOT
          # EXISTS set on first request.
          jq --arg n "$NAME" --arg id "$D1_DATABASE_ID" \
            '.d1_databases = [{ binding: "DB", database_name: $n, database_id: $id }]' \
            "$CONFIG_FILE" > "$CONFIG_FILE.tmp" && mv "$CONFIG_FILE.tmp" "$CONFIG_FILE"

      - name: Deploy
        id: deploy
        run: |
          set +e
          pnpm wrangler deploy -c wrangler-action.json > deploy.log 2>&1
          DEPLOY_EXIT_CODE=$?
          set -e

          # The workers.dev URL identifies a private instance, so redact it
          # before the log reaches the (public) run output.
          sed -E 's|https://[A-Za-z0-9.-]+\.workers\.dev|(***)|g' deploy.log

          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            echo "::error::wrangler deploy failed"
            exit 1
          fi

          WORKER_URL=$(grep -o "https://[A-Za-z0-9.-]*\.workers\.dev" deploy.log | head -n 1 || true)

          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      # /api/healthz is the readiness probe: it reads the config through the same
      # path a request takes and answers 503 when the store is unreachable, so it
      # proves the bindings wired up above actually work.
      - name: Verify Deployment
        run: |
          WORKER_URL="${CUSTOM_DOMAIN:+https://$CUSTOM_DOMAIN}"
          WORKER_URL="${WORKER_URL:-${{ steps.deploy.outputs.worker_url }}}"

          if [ -z "$WORKER_URL" ]; then
            echo "::error::No reachable URL. Please set OPENLIST_CUSTOM_DOMAIN."
            exit 1
          fi

          for attempt in $(seq 1 6); do
            sleep 15
            HTTP_CODE=$(curl -sL -o response.json -w "%{http_code}" "$WORKER_URL/api/healthz" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $HTTP_CODE"
          done

          echo "::error::Health check failed (HTTP $HTTP_CODE). A brand new custom domain may still be provisioning its certificate."
          cat response.json || true
          exit 1
